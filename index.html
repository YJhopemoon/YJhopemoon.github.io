<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zootopia 2 K-pop 抽獎機</title>

<style>
  body {
    margin: 0;
    font-family: "Noto Sans TC", sans-serif;
    background: #111;
    color: white;
    overflow-x: hidden;
    text-align: center;
  }

  .page { display: none; padding: 30px; }
  .active { display: block; }

  /* ------ 主頁 ------ */
  #home img {
    width: 80%;
    max-width: 500px;
    border-radius: 15px;
    margin-top: 20px;
  }
  .menu-btn {
    width: 85%;
    max-width: 420px;
    padding: 20px;
    background: #222;
    border-radius: 12px;
    margin: 25px auto;
    cursor: pointer;
    transition: 0.3s;
    font-size: 1.4em;
  }
  .menu-btn:hover {
    transform: scale(1.06);
    background: #444;
  }

  /* ------ 扭蛋機動畫 ------ */
  .machine {
    margin: 40px auto;
    width: 260px;
    height: 320px;
    background: #333;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    border: 3px solid #555;
  }
  .ball {
    width: 50px;
    height: 50px;
    background: #ffcc00;
    border-radius: 50%;
    position: absolute;
    animation: bounce 0.8s infinite;
    left: 105px;
    top: 220px;
  }
  @keyframes bounce {
    0% { top: 220px; }
    50% { top: 160px; }
    100% { top: 220px; }
  }

  .draw-btn {
    margin-top: 20px;
    padding: 15px 30px;
    background: #ffae00;
    color: black;
    font-size: 1.3em;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.25s;
  }
  .draw-btn:hover { transform: scale(1.1); background: #ffc93c; }

  /* ------ 抽出結果卡片 ------ */
  .result-box {
    margin-top: 30px;
    background: #222;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
    display: none;
  }

  .result-box img {
    width: 100%;
    border-radius: 10px;
  }

  .back {
    margin-top: 25px;
    display: block;
    font-size: 1.2em;
    color: #aaa;
    cursor: pointer;
  }
  .back:hover { color: white; }

</style>
</head>
<body>

<!-- ******************************************************** -->
<!--                     主頁  ZOOTOPIA 2                    -->
<!-- ******************************************************** -->
<div id="home" class="page active">
  <h1>動物方城市 2 × K-pop 抽獎機</h1>

  <!-- ⭐⭐⭐ 主頁圖片（請換成你喜歡的 Zootopia 2 圖片） -->
  <img src="【https://share.icloud.com/photos/045ZxJK4e_pr1_kP10anGUSBA】">

  <div class="menu-btn" onclick="goPage('music')">
    🎵  K-pop 音樂扭蛋機  
  </div>

  <div class="menu-btn" onclick="goPage('idol')">
    ⭐  K-pop 偶像抽卡機  
  </div>
</div>

<!-- ******************************************************** -->
<!--                       K-pop 音樂扭蛋                     -->
<!-- ******************************************************** -->
<div id="music" class="page">
  <h1>K-pop 音樂扭蛋機</h1>

  <!-- 志羚姐姐圖（可更換） -->
  <img src="【替換：動物方城市 志羚姐姐圖片】" style="width:270px;border-radius:12px;">

  <div class="machine">
    <div class="ball"></div>
  </div>

  <div class="draw-btn" onclick="drawSong()">🎶 抽一首歌！</div>

  <div id="songResult" class="result-box"></div>

  <span class="back" onclick="goPage('home')">⬅ 回主頁</span>
</div>


<!-- ******************************************************** -->
<!--                     K-pop 偶像抽卡                        -->
<!-- ******************************************************** -->
<div id="idol" class="page">
  <h1>K-pop 偶像抽卡機</h1>

  <!-- 尼克 + 茱蒂 的圖片（可更換） -->
  <img src="【替換：尼克與哈茱蒂圖片】" style="width:270px;border-radius:12px;">

  <div class="machine">
    <div class="ball"></div>
  </div>

  <div class="draw-btn" onclick="drawIdol()">✨ 抽一位偶像！</div>

  <div id="idolResult" class="result-box"></div>

  <span class="back" onclick="goPage('home')">⬅ 回主頁</span>
</div>



<!-- ******************************************************** -->
<!--                        SCRIPT                            -->
<!-- ******************************************************** -->
<script>

/* -----------------------------------------------------------
   🟣 K-pop 歌曲清單（從初代團到現代團）
   你可自由加歌 / 換 MV 圖片 / 換連結
------------------------------------------------------------ */
const songs = [
  {
    name: "HOT – Candy",
    artist: "HOT",
    mv: "【MV 連結】",
    img: "【MV 照片】"
  },
  {
    name: "TVXQ – Mirotic",
    artist: "東方神起",
    mv: "【MV 連結】",
    img: "【MV 照片】"
  },
  {
    name: "Girls' Generation – Gee",
    artist: "少女時代",
    mv: "【MV 連結】",
    img: "【MV 照片】"
  },
  {
    name: "BIGBANG – Fantastic Baby",
    artist: "BIGBANG",
    mv: "【MV 連結】",
    img: "【MV 照片】"
  },
  {
    name: "BTS – MIC Drop",
    artist: "BTS",
    mv: "https://youtu.be/kTlv5_Bs8aw",
    img: "https://i.imgur.com/N7zQszP.jpeg"
  },
  {
    name: "LE SSERAFIM – Easy",
    artist: "LE SSERAFIM",
    mv: "【MV】",
    img: "【照片】"
  }
];


/* -----------------------------------------------------------
   🟣 偶像清單（團體+個人）
------------------------------------------------------------ */
const idols = [
  {
    name: "BTS",
    members: "RM, Jin, SUGA, J-Hope, Jimin, V, Jungkook",
    debut: "2013",
    img: "【替換：BTS 圖片】"
  },
  {
    name: "BLACKPINK",
    members: "Jisoo, Jennie, Rosé, Lisa",
    debut: "2016",
    img: "【BLACKPINK 圖片】"
  },
  {
    name: "IVE",
    members: "Yujin, Gaeul, Rei, Wonyoung, Liz, Leeseo",
    debut: "2021",
    img: "【IVE 圖片】"
  },
  {
    name: "EXO",
    members: "S, X, O 成員（自己補）",
    debut: "2012",
    img: "【EXO 圖片】"
  },
  {
    name: "J-Hope（個人）",
    members: "個人",
    debut: "2018",
    img: "【J-Hope 個人照】"
  }
];


function goPage(p) {
  document.querySelectorAll(".page").forEach(pg => pg.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}


/* -----------------------------------------------------------
   🎵 扭蛋：抽歌
------------------------------------------------------------ */
function drawSong() {
  const s = songs[Math.floor(Math.random() * songs.length)];

  document.getElementById("songResult").innerHTML = `
    <h2>${s.name}</h2>
    <p>歌手：${s.artist}</p>
    <a href="${s.mv}" target="_blank">📺 MV 連結</a>
    <br><br>
    <img src="${s.img}">
  `;
  document.getElementById("songResult").style.display = "block";
}


/* -----------------------------------------------------------
   ⭐ 抽卡：抽偶像
------------------------------------------------------------ */
function drawIdol() {
  const i = idols[Math.floor(Math.random() * idols.length)];

  document.getElementById("idolResult").innerHTML = `
    <h2>${i.name}</h2>
    <p>出道年份：${i.debut}</p>
    ${i.members !== "個人" ? `<p>成員：${i.members}</p>` : ""}
    <img src="${i.img}">
  `;
  document.getElementById("idolResult").style.display = "block";
}

</script>

</body>
</html>
