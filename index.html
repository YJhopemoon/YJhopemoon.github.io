<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Zootopia 2 主題 — K-pop 扭蛋 & 抽卡（SSR/SR/R）</title>
<style>
  :root{
    --zoo-orange: #ffb86b;
    --zoo-cream: #fff3df;
    --zoo-green: #6bbf6b;
    --zoo-gray: #2b2b2b;
    --text: #17201a;
    --glass: rgba(255,255,255,0.06);
    --ssr: linear-gradient(45deg,#ffd66b,#ffb86b);
    --sr: linear-gradient(45deg,#8fb6ff,#c59bff);
    --r: linear-gradient(45deg,#b7f4bd,#9bd79b);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:"Noto Sans TC", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
  body{
    background: linear-gradient(180deg,#eaf7f0 0%, #f7f3ea 45%, #eef6ff 100%);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ===== Header / Hero (Judy left, Nick right) ===== */
  .hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    max-width:1200px;
    margin:24px auto;
    padding:26px;
    background: linear-gradient(90deg, rgba(255,255,255,0.85), rgba(255,250,240,0.9));
    border-radius:18px;
    box-shadow: 0 10px 30px rgba(16,24,32,0.08);
  }

  .mascot{
    width:220px;
    height:220px;
    border-radius:16px;
    overflow:hidden;
    background:var(--zoo-cream);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }
  .mascot img{ width:100%; height:100%; object-fit:cover; display:block; }

  .center{
    flex:1;
    text-align:center;
  }
  .title{
    font-size:28px;
    margin:4px 0 8px 0;
    font-weight:800;
    letter-spacing:0.6px;
  }
  .subtitle{ color:#4b4b4b; margin:0 0 18px 0; }

  .big-buttons{
    display:flex;
    gap:18px;
    justify-content:center;
    margin-top:6px;
  }
  .btn{
    min-width:200px;
    padding:16px 22px;
    border-radius:999px;
    border:none;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 12px 26px rgba(27,27,27,0.08);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn:active{ transform:translateY(2px) }
  .btn-music{ background: linear-gradient(90deg,var(--zoo-orange),#ff9f3d); color:var(--zoo-gray); }
  .btn-idol{ background: linear-gradient(90deg,var(--zoo-green),#38a93a); color:white; }

  /* ===== Stage area ===== */
  .stage-wrap{
    max-width:1100px;
    margin:22px auto;
    padding:20px;
  }

  .stage{
    background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(250,250,250,0.95));
    border-radius:14px;
    padding:20px;
    box-shadow:0 12px 30px rgba(12,20,30,0.06);
    min-height:420px;
    position:relative;
  }

  .stage h2{ margin:6px 0 12px 0; font-size:20px; }
  .hint{ color:#666; font-size:13px; margin-bottom:12px; }

  /* ===== Gacha: 大量滾動扭蛋 ===== */
  .gacha-area{
    display:flex;
    gap:18px;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
  }

  .tower{
    width:360px;
    height:360px;
    background:linear-gradient(180deg,#f9f6ef, #fff);
    border-radius:14px;
    border:3px solid rgba(0,0,0,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 20px 40px rgba(0,0,0,0.06);
  }

  .tube{
    width:220px;
    height:260px;
    border-radius:12px;
    overflow:hidden;
    background:linear-gradient(180deg,#fff,#f2f2f2);
    border:1px solid rgba(0,0,0,0.04);
    position:relative;
  }

  .egg-list{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    top:0;
  }

  .egg{
    width:160px;height:48px;margin:8px auto;border-radius:28px;background:linear-gradient(180deg,#ffd57a,#ffb86b);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#2b2b2b;
    box-shadow:0 6px 14px rgba(0,0,0,0.08);
  }

  /* central window highlight */
  .center-line{
    position:absolute;left:0;right:0;top:50%;height:64px;margin-top:-32px;border-top:2px dashed rgba(0,0,0,0.03);border-bottom:2px dashed rgba(0,0,0,0.02);pointer-events:none;
  }

  .controls{
    display:flex;flex-direction:column;gap:10px;align-items:center;
  }
  .small-btn{
    padding:12px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;
    background: #fff; color:var(--zoo-gray); box-shadow:0 8px 18px rgba(0,0,0,0.06);
  }

  /* ===== Result card (song) ===== */
  .result{
    margin-top:18px;
    display:flex;
    gap:14px;
    align-items:center;
    justify-content:center;
  }
  .result img{ width:220px;height:120px;object-fit:cover;border-radius:10px;border:3px solid rgba(0,0,0,0.06) }

  .meta{ text-align:left; max-width:520px; }

  .meta h3{ margin:0 0 6px 0; font-size:18px }
  .meta p{ margin:2px 0; color:#444 }
  .meta a{ display:inline-block;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--glass); text-decoration:none;color:var(--text); font-weight:700 }

  /* ===== Card Drop (idol) 3D ===== */
  .card-slot{
    width:320px;height:380px;margin:auto;position:relative;perspective:1200px;
  }

  .card-wrapper{
    position:absolute;left:50%;top:-260px;transform:translateX(-50%);
    transform-origin:center top;
  }
  .card{
    width:280px;height:360px;background:#fff;color:#111;border-radius:12px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,0.18);
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    backface-visibility:hidden; transform-style:preserve-3d;
  }
  .card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
  .card .name{font-weight:900;font-size:18px;margin-top:6px}
  .card .sub{color:#666;font-size:13px;margin-top:4px;text-align:center}

  /* rarity glows */
  .rarity-SSR{ box-shadow: 0 12px 40px rgba(255,200,60,0.18), 0 0 26px rgba(255,200,60,0.12) }
  .rarity-SR { box-shadow: 0 12px 40px rgba(115,100,255,0.12), 0 0 20px rgba(115,100,255,0.08) }
  .rarity-R  { box-shadow: 0 12px 40px rgba(90,200,120,0.08), 0 0 12px rgba(90,200,120,0.06) }

  /* particle canvas overlay for SSR sparkle */
  #particles{ position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; }

  /* responsive */
  @media (max-width:820px){
    .hero{ flex-direction:column; align-items:center }
    .mascot{ width:160px;height:160px }
    .big-buttons{ flex-direction:column }
    .gacha-area{ flex-direction:column }
    .card-slot{ width:280px }
    .tower{ width:300px; height:300px }
  }
</style>
</head>
<body>

<!-- HERO: Judy (left) - center buttons - Nick (right) -->
<div class="hero">
  <div class="mascot" id="judy">
    <!-- 替換成 Judy 圖片 URL（請使用你有權使用的圖片） -->
    <img src="https://via.placeholder.com/400x400.png?text=Judy+(替換)" alt="Judy 圖示">
  </div>

  <div class="center">
    <div class="title">動物方城市 2 主題 — K-pop 扭蛋 & 抽卡</div>
    <div class="subtitle">選擇一個模式：抽歌（扭蛋）或抽偶像（卡片）</div>

    <div class="big-buttons">
      <button class="btn btn-music" onclick="openMode('music')">🎵 K-pop 音樂 扭蛋</button>
      <button class="btn btn-idol" onclick="openMode('idol')">🌟 K-pop 偶像 抽卡</button>
    </div>
  </div>

  <div class="mascot" id="nick">
    <!-- 替換成 Nick 圖片 URL（請使用你有權使用的圖片） -->
    <img src="https://via.placeholder.com/400x400.png?text=Nick+(替換)" alt="Nick 圖示">
  </div>
</div>

<!-- STAGE -->
<div class="stage-wrap">
  <div class="stage" id="stage" style="display:none">

    <!-- particles canvas (for SSR) -->
    <canvas id="particles"></canvas>

    <!-- Music Panel -->
    <div id="musicPanel" style="display:none">
      <h2>K-pop 音樂 扭蛋</h2>
      <div class="hint">按下「開始抽蛋」會看到大量扭蛋滾動，最後掉出一顆開出歌曲（含 MV / 縮圖 / 稀有度）。</div>

      <div class="gacha-area">
        <div class="tower">
          <div class="tube" id="eggTube">
            <div class="egg-list" id="eggList">
              <!-- JS 產生多個 .egg 元素並 animate translateY -->
            </div>
            <div class="center-line"></div>
          </div>
        </div>

        <div class="controls">
          <button class="small-btn" id="musicStartBtn">開始抽蛋</button>
          <button class="small-btn" id="musicStopBtn">快速停止</button>
          <button class="small-btn" id="backBtn1">返回首頁</button>
        </div>
      </div>

      <div class="result" id="musicResultBox" style="display:none">
        <img id="musicThumb" src="" alt="mv thumb">
        <div class="meta">
          <h3 id="musicTitle"></h3>
          <p id="musicArtist"></p>
          <a id="musicLink" href="#" target="_blank">觀看 MV</a>
          <div id="musicRarity" style="margin-top:10px;font-weight:900"></div>
        </div>
      </div>
    </div>

    <!-- Idol Panel -->
    <div id="idolPanel" style="display:none">
      <h2>K-pop 偶像 抽卡</h2>
      <div class="hint">按「抽卡」會掉下一張卡片，卡片會根據稀有度顯示特效與框色。</div>

      <div class="card-slot">
        <div class="card-wrapper" id="cardWrapper" aria-hidden="true"></div>
      </div>

      <div style="display:flex;gap:14px;justify-content:center;margin-top:14px">
        <button class="small-btn" id="idolStartBtn">抽卡</button>
        <button class="small-btn" id="backBtn2">返回首頁</button>
      </div>

      <div id="idolExtra" style="margin-top:16px;text-align:center;color:#444"></div>
    </div>

  </div>
</div>

<script>
/* ===========================
   Data sets (can expand to 500+ items)
   Each item includes a rarity: "SSR" | "SR" | "R"
   Replace image URLs with your own legal images.
   =========================== */

/* Example songs from early K-pop to modern era (add more as needed) */
const songs = [
  { title:"Candy", artist:"HOT", yt:"https://youtu.be/EXAMPLE1", img:"https://via.placeholder.com/640x360.png?text=HOT+Candy", rarity:"R" },
  { title:"Mirotic", artist:"TVXQ", yt:"https://youtu.be/EXAMPLE2", img:"https://via.placeholder.com/640x360.png?text=Mirotic", rarity:"SR" },
  { title:"Gee", artist:"Girls' Generation", yt:"https://youtu.be/EXAMPLE3", img:"https://via.placeholder.com/640x360.png?text=Gee", rarity:"R" },
  { title:"Fantastic Baby", artist:"BIGBANG", yt:"https://youtu.be/EXAMPLE4", img:"https://via.placeholder.com/640x360.png?text=Fantastic+Baby", rarity:"SR" },
  { title:"MIC Drop", artist:"BTS", yt:"https://youtu.be/kTlv5_Bs8aw", img:"https://i.imgur.com/N7zQszP.jpeg", rarity:"SR" },
  { title:"Dynamite", artist:"BTS", yt:"https://youtu.be/gdZLi9oWNZg", img:"https://i.imgur.com/5XfK4dG.png", rarity:"R" },
  { title:"Next Gen Hit", artist:"NewGen", yt:"https://youtu.be/EXAMPLE5", img:"https://via.placeholder.com/640x360.png?text=NewGen", rarity:"SSR" },
  // → 可繼續加入至 500+
];

/* Example idols (group or solo). For groups, members is a string */
const idols = [
  { name:"BTS", debut:"2013-06-13", members:"RM, Jin, Suga, J-Hope, Jimin, V, Jungkook", img:"https://i.imgur.com/N7zQszP.jpeg", rarity:"SR" },
  { name:"J-Hope", debut:"2013/solo2018", members:"(solo)", img:"https://via.placeholder.com/400x400.png?text=J-Hope", rarity:"SR" },
  { name:"BLACKPINK", debut:"2016-08-08", members:"Jisoo, Jennie, Rosé, Lisa", img:"https://via.placeholder.com/400x400.png?text=BLACKPINK", rarity:"SR" },
  { name:"IconicLegend", debut:"2000", members:"Member1, Member2", img:"https://via.placeholder.com/400x400.png?text=Iconic", rarity:"R" },
  { name:"UltraStar", debut:"2024", members:"Solo", img:"https://via.placeholder.com/400x400.png?text=UltraStar", rarity:"SSR" },
  // → 可繼續加入至 500+
];

/* ===========================
   Rarity probabilities (you can tune)
   SSR: 3%, SR: 17%, R: 80%
   If you want other distribution, edit here.
   =========================== */
const rarityWeights = {
  SSR: 3,
  SR: 17,
  R: 80
};

/* helper: choose rarity based on weights */
function chooseRarity(){
  const total = Object.values(rarityWeights).reduce((a,b)=>a+b,0);
  let rnd = Math.random()*total;
  for(const r of ["SSR","SR","R"]){
    const w = rarityWeights[r];
    if(rnd < w) return r;
    rnd -= w;
  }
  return "R";
}

/* helper: pick random item from array with matching rarity
   if none of that rarity exist, fallback to any item.
*/
function pickByRarity(list){
  const r = chooseRarity();
  const candidates = list.filter(i => i.rarity === r);
  if(candidates.length>0) return { item: candidates[Math.floor(Math.random()*candidates.length)], rarity: r };
  // fallback: try any
  const any = list[Math.floor(Math.random()*list.length)];
  return { item:any, rarity: any.rarity || r };
}

/* ===========================
   UI & Animation logic
   =========================== */
const stage = document.getElementById('stage');
const musicPanel = document.getElementById('musicPanel');
const idolPanel = document.getElementById('idolPanel');

const eggList = document.getElementById('eggList');
const eggTube = document.getElementById('eggTube');
const musicStartBtn = document.getElementById('musicStartBtn');
const musicStopBtn = document.getElementById('musicStopBtn');
const backBtn1 = document.getElementById('backBtn1');

const musicResultBox = document.getElementById('musicResultBox');
const musicThumb = document.getElementById('musicThumb');
const musicTitle = document.getElementById('musicTitle');
const musicArtist = document.getElementById('musicArtist');
const musicLink = document.getElementById('musicLink');
const musicRarity = document.getElementById('musicRarity');

const cardWrapper = document.getElementById('cardWrapper');
const idolStartBtn = document.getElementById('idolStartBtn');
const backBtn2 = document.getElementById('backBtn2');
const idolExtra = document.getElementById('idolExtra');

const particlesCanvas = document.getElementById('particles');
const ctx = particlesCanvas.getContext ? particlesCanvas.getContext('2d') : null;
let particles = [];
let particlesAnimation = null;

/* responsive canvas size */
function fitCanvas(){
  particlesCanvas.width = document.documentElement.clientWidth;
  particlesCanvas.height = document.documentElement.clientHeight;
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

/* show main stage and correct panel */
function openMode(mode){
  stage.style.display = 'block';
  if(mode==='music'){
    musicPanel.style.display = 'block';
    idolPanel.style.display = 'none';
    initEggs();
    musicResultBox.style.display = 'none';
  } else {
    musicPanel.style.display = 'none';
    idolPanel.style.display = 'block';
    cardWrapper.innerHTML = '';
    idolExtra.textContent = '';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* HOME button handlers */
backBtn1.addEventListener('click', ()=>{
  stage.style.display = 'none';
  musicPanel.style.display = 'none';
});
backBtn2.addEventListener('click', ()=>{
  stage.style.display = 'none';
  idolPanel.style.display = 'none';
});

/* ===== Eggs initialization: create many eggs in the tube ===== */
function initEggs(){
  eggList.innerHTML = '';
  // Create repeated sequence for smooth looping
  const seq = [];
  // prepare labels with rarity color mark
  for(let i=0;i<40;i++){
    const idx = i % songs.length;
    const s = songs[idx];
    seq.push(s);
  }
  // shuffle slightly
  for(let i=0;i<seq.length;i++){
    const j = Math.floor(Math.random()*seq.length);
    [seq[i], seq[j]] = [seq[j], seq[i]];
  }
  seq.forEach((s, i)=>{
    const d = document.createElement('div');
    d.className = 'egg';
    d.textContent = s.title;
    d.dataset.index = i;
    // small color by rarity
    if(s.rarity === 'SSR') d.style.background = 'linear-gradient(90deg,#ffefb5,#ffd66b)';
    else if(s.rarity === 'SR') d.style.background = 'linear-gradient(90deg,#cfe0ff,#b6a6ff)';
    else d.style.background = 'linear-gradient(90deg,#dff9e0,#b7f4bd)';
    eggList.appendChild(d);
  });
  // place initial translateY so that items scroll
  eggList.style.transform = 'translateY(0px)';
}

/* ===== Gacha rolling logic ===== */
let spinning = false;
let scrollPos = 0;
let scrollSpeed = 0;
let scrollTicker = null;

function startMusicSpin(){
  if(spinning) return;
  spinning = true;
  musicResultBox.style.display = 'none';
  // randomize speed
  scrollSpeed = 12 + Math.random()*6; // px per frame
  // animate
  scrollTicker = requestAnimationFrame(stepScroll);
}

function stepScroll(){
  // loop eggs by translating and wrapping
  scrollPos += scrollSpeed;
  // wrap-around when scrollPos too large
  const listHeight = eggList.scrollHeight;
  if(listHeight>0 && scrollPos > listHeight/2) scrollPos = scrollPos % (listHeight/2);
  eggList.style.transform = `translateY(-${scrollPos}px)`;
  // slight friction
  scrollSpeed *= 0.995;
  // schedule next
  if(spinning) scrollTicker = requestAnimationFrame(stepScroll);
}

/* quick stop: decelerate faster then align to center item */
function stopMusicSpin(){
  if(!spinning) return;
  // decelerate quickly
  const stopInterval = setInterval(()=>{
    scrollSpeed *= 0.85;
    if(scrollSpeed < 0.5){
      clearInterval(stopInterval);
      // align to nearest item at center
      alignToCenterAndReveal();
    }
  }, 60);
}

/* align to central item and show result */
function alignToCenterAndReveal(){
  spinning = false;
  if(scrollTicker) cancelAnimationFrame(scrollTicker);
  // compute which child is at center
  const eggs = Array.from(eggList.children);
  if(eggs.length===0) return;
  const tubeRect = eggTube.getBoundingClientRect();
  const centerYInList = scrollPos + tubeRect.height/2;
  // each egg height + margin: compute from DOM
  const eggHeight = eggs[0].getBoundingClientRect().height + 16; // approximate gap
  const idx = Math.round(centerYInList / eggHeight) % eggs.length;
  const chosen = eggs[((idx%eggs.length)+eggs.length)%eggs.length];
  // find song by title (simple matching)
  const title = chosen.textContent;
  // find in songs array
  const matched = songs.find(s => s.title === title) || songs[Math.floor(Math.random()*songs.length)];
  // animate to exact position (smooth)
  const targetPos = ( (eggs.indexOf(chosen)) * eggHeight ) - (tubeRect.height/2 - eggHeight/2);
  smoothScrollTo(targetPos, 600, ()=>{
    // reveal result
    showMusicResult(matched);
  });
}

/* smooth scroll helper */
function smoothScrollTo(target, duration=600, cb){
  const start = scrollPos;
  const change = target - start;
  const startTime = performance.now();
  function animate(t){
    let now = t;
    const elapsed = now - startTime;
    const tnorm = Math.min(1, elapsed/duration);
    const ease = 1 - Math.pow(1 - tnorm, 3);
    scrollPos = start + change * ease;
    eggList.style.transform = `translateY(-${scrollPos}px)`;
    if(tnorm < 1) requestAnimationFrame(animate);
    else {
      if(cb) cb();
    }
  }
  requestAnimationFrame(animate);
}

/* show music result with rarity effect */
function showMusicResult(song){
  musicThumb.src = song.img || 'https://via.placeholder.com/640x360.png?text=MV';
  musicTitle.textContent = song.title;
  musicArtist.textContent = song.artist;
  musicLink.href = song.yt;
  musicLink.textContent = "觀看 MV（YouTube）";
  musicRarity.textContent = '稀有度：' + (song.rarity || 'R');
  // apply visual effect for rarity
  applyRarityEffect(song.rarity || 'R');
  musicResultBox.style.display = 'flex';
}

/* apply rarity particles & glow */
function applyRarityEffect(r){
  // clear previous canvas particles
  particles = [];
  cancelAnimationFrame(particlesAnimation);
  // small highlight depending on rarity
  if(r === 'SSR'){
    // golden particles for a short burst
    spawnParticles(80, '#ffd66b');
    highlightElement(musicResultBox, 'rarity-SSR');
  } else if(r === 'SR'){
    spawnParticles(50, '#9fb3ff');
    highlightElement(musicResultBox, 'rarity-SR');
  } else {
    spawnParticles(30, '#b7f4bd');
    highlightElement(musicResultBox, 'rarity-R');
  }
  // render particles for 2.4s
  let life = 2400;
  const start = performance.now();
  function render(now){
    const dt = now - start;
    ctx && ctx.clearRect(0,0,particlesCanvas.width, particlesCanvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.05;
      p.life -= 16;
      if(ctx){
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
    });
    particles = particles.filter(p => p.life > 0 && p.y < particlesCanvas.height+50);
    if(now - start < life) particlesAnimation = requestAnimationFrame(render);
    else {
      ctx && ctx.clearRect(0,0,particlesCanvas.width, particlesCanvas.height);
    }
  }
  particlesAnimation = requestAnimationFrame(render);
}

/* spawn particles around center */
function spawnParticles(count, color){
  const cx = window.innerWidth/2;
  const cy = window.innerHeight/2 - 80;
  for(let i=0;i<count;i++){
    particles.push({
      x: cx + (Math.random()*200-100),
      y: cy + (Math.random()*80-40),
      vx: (Math.random()*6-3),
      vy: (Math.random()*-6-2),
      size: Math.random()*4 + 2,
      color: color,
      life: 120 + Math.random()*160
    });
  }
}

/* simple highlight adding class then remove after time */
function highlightElement(el, cls){
  el.classList.remove('rarity-SSR','rarity-SR','rarity-R');
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),2200);
}

/* ===== Idol draw: drop card with 3D flip + rarity effect ===== */
function drawIdol(){
  cardWrapper.innerHTML = '';
  idolExtra.textContent = '';
  const pick = pickByRarity(idols); // returns {item, rarity}
  const data = pick.item;
  // create a card element
  const wrapper = document.createElement('div');
  wrapper.style.transform = 'translateY(-260px)';
  wrapper.style.transition = 'transform .7s cubic-bezier(.2,.9,.25,1)';
  const card = document.createElement('div');
  card.className = 'card';
  // assign rarity class
  if(pick.rarity === 'SSR') card.classList.add('rarity-SSR');
  else if(pick.rarity === 'SR') card.classList.add('rarity-SR');
  else card.classList.add('rarity-R');

  card.innerHTML = `
    <img src="${data.img || 'https://via.placeholder.com/400x300.png?text=Photo'}" alt="${data.name}">
    <div class="name">${data.name}</div>
    <div class="sub">出道：${data.debut || '—'}</div>
    <div class="sub">${data.members ? '成員：' + data.members : ''}</div>
  `;
  wrapper.appendChild(card);
  cardWrapper.appendChild(wrapper);

  // drop animation
  requestAnimationFrame(()=>{
    wrapper.style.transform = 'translateY(0)';
  });
  // small flip effect
  setTimeout(()=>{ card.style.transform = 'rotateX(0deg)'; }, 120);

  // show extra text and particles by rarity
  const desc = `抽到：${data.name}（稀有度 ${pick.rarity}）`;
  idolExtra.textContent = desc;
  applyRarityEffect(pick.rarity);
}

/* helper pickByRarity for idols uses same as for songs */
function pickByRarity(list){
  const r = chooseRarity();
  const candidates = list.filter(i => (i.rarity || 'R') === r);
  if(candidates.length > 0) return { item: candidates[Math.floor(Math.random()*candidates.length)], rarity: r };
  return { item: list[Math.floor(Math.random()*list.length)], rarity: 'R' };
}

/* ===== button events wiring ===== */
musicStartBtn.addEventListener('click', ()=>{ startMusicSpin(); });
musicStopBtn.addEventListener('click', ()=>{ stopMusicSpin(); });
idolStartBtn.addEventListener('click', ()=>{ drawIdol(); });

/* also map openMode to global for button handlers */
window.openMode = openMode;

/* init: make sure tube has some eggs when page opens */
initEggs();

/* ensure canvas has 2d context available check */
if(!ctx){
  // no canvas support; particle effects will be skipped but rest works
  console.warn('Canvas 2D not supported — particle effects disabled.');
}
