<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>復古電視機 - 多平台頻道</title>

<style>
body {
  background: #111;
  font-family: "Arial", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 📺 電視機外框 */
.tv-frame {
  width: 850px;
  height: 600px;
  background: #2a2a2a;
  border-radius: 25px;
  padding: 25px;
  position: relative;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

/* 📺 電視螢幕 */
.screen {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  border-radius: 15px;
  position: relative;
}

/* 📺 CRT 雜訊背景 */
#staticEffect {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('https://i.imgur.com/6Qon3rL.gif');
  background-size: cover;
  opacity: 0;
  transition: 0.3s;
  pointer-events: none;
}

/* 📺 螢幕內頁 */
.page {
  display: none;
  color: white;
  padding: 30px;
  text-align: center;
  font-size: 28px;
}

/* 啟用頁 */
.page.active {
  display: block;
}

/* 📺 🎛 右邊 APP 旋鈕區 */
.tv-buttons {
  position: absolute;
  right: -120px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.app-btn {
  width: 90px;
  height: 90px;
  border-radius: 20px;
  background-size: 80%;
  background-repeat: no-repeat;
  background-position: center;
  background-color: #000;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0,0,0,0.7);
  transition: 0.15s;
  border: 3px solid #555;
}

.app-btn:active {
  transform: scale(0.90);
}

.knob-label {
  color: #fff;
  text-align: center;
  margin-top: 5px;
  font-size: 16px;
}

/* 電視換台動畫 */
.fadeout {
  opacity: 0;
  transition: 0.3s;
}

.fadein {
  opacity: 1;
  transition: 0.3s;
}

</style>
</head>
<body>

<div class="tv-frame">
  <div class="screen">

    <!-- CRT 靜電 -->
    <div id="staticEffect"></div>

    <!-- 📺 主頁 -->
    <div id="home" class="page active">
      📺 很久沒有打開電視機了吧？<br><br>
      👉 請用右邊選擇你想看的頻道
    </div>

    <!-- 📺 YouTube -->
    <div id="youtube" class="page">
      <h2>YouTube 熱門影片</h2>
      <a href="https://www.youtube.com/" target="_blank" style="color:#4ac4ff;">
        ▶ 打開 YouTube
      </a>
    </div>

    <!-- 📺 Netflix -->
    <div id="netflix" class="page">
      <h2>Netflix 熱門影集</h2>
      <a href="https://www.netflix.com" target="_blank" style="color:#e50914;">
        ▶ 打開 Netflix
      </a>
    </div>

    <!-- 📺 Disney+ -->
    <div id="disney" class="page">
      <h2>Disney+ 熱門動畫</h2>
      <a href="https://www.disneyplus.com" target="_blank" style="color:#7bb5ff;">
        ▶ 打開 Disney+
      </a>
    </div>

    <!-- 📺 愛奇藝 -->
    <div id="iqiyi" class="page">
      <h2>愛奇藝 熱門節目</h2>
      <a href="https://www.iq.com" target="_blank" style="color:#91ff4a;">
        ▶ 打開 愛奇藝
      </a>
    </div>

  </div>

  <!-- 📺 右側 APP 旋鈕按鈕 -->
  <div class="tv-buttons">

    <div>
      <div class="app-btn"
        onclick="switchChannel('home')"
        style="background-image:url('https://cdn-icons-png.flaticon.com/512/60/60525.png');">
      </div>
      <div class="knob-label">主頁</div>
    </div>

    <div>
      <div class="app-btn"
        onclick="switchChannel('youtube')"
        style="background-image:url('https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2023.svg'); background-size:90%;">
      </div>
      <div class="knob-label">YouTube</div>
    </div>

    <div>
      <div class="app-btn"
        onclick="switchChannel('netflix')"
        style="background-image:url('https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg'); background-size:90%;">
      </div>
      <div class="knob-label">Netflix</div>
    </div>

    <div>
      <div class="app-btn"
        onclick="switchChannel('disney')"
        style="background-image:url('https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg'); background-size:85%;">
      </div>
      <div class="knob-label">Disney+</div>
    </div>

    <div>
      <div class="app-btn"
        onclick="switchChannel('iqiyi')"
        style="background-image:url('https://upload.wikimedia.org/wikipedia/commons/6/6c/IQIYI_logo.svg'); background-size:85%;">
      </div>
      <div class="knob-label">愛奇藝</div>
    </div>

  </div>

</div>

<script>
/* 📺 頻道切換 + 雪花特效 */
function switchChannel(pageID) {
  const pages = document.querySelectorAll(".page");
  const staticFX = document.getElementById("staticEffect");

  pages.forEach(p => p.classList.remove("active"));
  staticFX.style.opacity = 1;

  setTimeout(() => {
    document.getElementById(pageID).classList.add("active");
    staticFX.style.opacity = 0;
  }, 600);
}
</script>

</body>
</html>
