<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJ Netflix Style</title>

<style>
  body {
    margin: 0;
    font-family: "Noto Sans TC", sans-serif;
    background-color: #000;
    color: #fff;
    overflow-x: hidden;
  }

  /* 頁面淡入滑動效果 */
  .page {
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 100vw;
    opacity: 0;
    transition: all 0.6s ease-in-out;
    padding: 40px;
    box-sizing: border-box;
  }
  .page.active {
    left: 0;
    opacity: 1;
  }

  h1 {
    font-size: 2.2em;
    margin-top: 30px;
    text-align: left;
  }

  /* 頭像首頁 */
  #home .profile-container {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin-top: 100px;
  }
  #home .profile {
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
  }
  #home .profile img {
    width: 160px;
    height: 160px;
    border-radius: 4px;
    border: 3px solid transparent;
    transition: 0.3s;
    filter: grayscale(100%);
  }
  #home .profile:hover img {
    border-color: #fff;
    transform: scale(1.08);
    filter: grayscale(0%);
  }
  #home .profile p {
    margin-top: 15px;
    font-size: 1.2em;
  }

  .back-btn {
    margin-top: 20px;
    display: inline-block;
    color: #ccc;
    font-size: 1.1em;
    cursor: pointer;
  }

  /* 🎞 Netflix 輪播區 ------------------------------------------------ */
  .carousel-container {
    position: relative;
    margin-top: 30px;
  }

  .carousel-title {
    font-size: 1.6em;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
    gap: 15px;
    padding-bottom: 20px;
  }

  .carousel::-webkit-scrollbar {
    display: none; /* 隱藏捲軸 */
  }

  .item {
    min-width: 220px;
    height: 130px;
    background-color: #222;
    border-radius: 6px;
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
    transition: 0.3s;
  }
  .item:hover {
    transform: scale(1.06);
    background-color: #444;
  }

  .item img {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    object-fit: cover;
    filter: grayscale(100%);
    transition: .4s;
  }
  .item:hover img {
    filter: grayscale(0%);
  }

  .item-title {
    margin-top: 10px;
    font-size: 1em;
    color: #aaa;
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>Who's Watching?</h1>

  <div class="profile-container">

    <div class="profile" onclick="goTo('profile')">
      <img src="https://i.imgur.com/5XfK4dG.png">
      <p>YJ</p>
    </div>

    <div class="profile" onclick="goTo('playlist')">
      <img src="https://i.imgur.com/u7ArQJG.png">
      <p>歌單</p>
    </div>

    <div class="profile" onclick="goTo('idol')">
      <img src="https://i.imgur.com/XohC99S.png">
      <p>BTS</p>
    </div>

  </div>
</div>

<!-- PROFILE PAGE -->
<div id="profile" class="page">
  <h1>YJ 的個人頁面</h1>

  <div class="carousel-title">興趣清單</div>
  <div class="carousel">
    <div class="item"><img src="https://i.imgur.com/LKp0zuH.jpeg"><p class="item-title">看小說</p></div>
    <div class="item"><img src="https://i.imgur.com/Y5u4Ssf.jpeg"><p class="item-title">追劇</p></div>
    <div class="item"><img src="https://i.imgur.com/s7beKij.jpeg"><p class="item-title">聽音樂</p></div>
  </div>

  <span class="back-btn" onclick="goTo('home')">⬅ 返回首頁</span>
</div>

<!-- PLAYLIST PAGE -->
<div id="playlist" class="page">
  <h1>K-POP 熱門歌曲</h1>

  <div class="carousel-title">BTS</div>
  <div class="carousel">
    <a href="https://www.youtube.com/watch?v=kTlv5_Bs8aw" target="_blank">
      <div class="item"><img src="https://i.imgur.com/N7zQszP.jpeg"></div>
    </a>
    <a href="https://www.youtube.com/watch?v=9mQk7Evt6Vs" target="_blank">
      <div class="item"><img src="https://i.imgur.com/iCVxYgW.jpeg"></div>
    </a>
    <a href="https://www.youtube.com/watch?v=hlZnYV9m1cU" target="_blank">
      <div class="item"><img src="https://i.imgur.com/gJSj3Li.jpeg"></div>
    </a>
  </div>

  <div class="carousel-title">其他熱門歌曲</div>
  <div class="carousel">
    <a href="https://www.youtube.com/watch?v=GZjt_sA2eso" target="_blank">
      <div class="item"><img src="https://i.imgur.com/cQU3YqH.jpeg"></div>
    </a>
    <a href="https://www.youtube.com/watch?v=UOxkGD8qRB4" target="_blank">
      <div class="item"><img src="https://i.imgur.com/ijQgTtK.jpeg"></div>
    </a>
    <a href="https://www.youtube.com/watch?v=MBdVXkSdhwU" target="_blank">
      <div class="item"><img src="https://i.imgur.com/SiyBLhp.jpeg"></div>
    </a>
  </div>

  <span class="back-btn" onclick="goTo('home')">⬅ 返回首頁</span>
</div>

<!-- IDOL PAGE -->
<div id="idol" class="page">
  <h1>BTS 防彈少年團</h1>

  <div class="carousel-title">成員（黑白灰風）</div>
  <div class="carousel">
    <div class="item"><img src="https://i.imgur.com/G6XgmLt.jpeg"><p class="item-title">RM</p></div>
    <div class="item"><img src="https://i.imgur.com/Ii2XNSC.jpeg"><p class="item-title">Jin</p></div>
    <div class="item"><img src="https://i.imgur.com/X0lRtc0.jpeg"><p class="item-title">Suga</p></div>
    <div class="item"><img src="https://i.imgur.com/BX0yQm3.jpeg"><p class="item-title">J-Hope（你的本命）</p></div>
    <div class="item"><img src="https://i.imgur.com/SyhtFqX.jpeg"><p class="item-title">Jimin</p></div>
    <div class="item"><img src="https://i.imgur.com/o5jKf8A.jpeg"><p class="item-title">V</p></div>
    <div class="item"><img src="https://i.imgur.com/0N9qo5Y.jpeg"><p class="item-title">Jungkook</p></div>
  </div>

  <div class="carousel-title">推薦歌曲（可點擊播放）</div>
  <div class="carousel">
    <a href="https://www.youtube.com/watch?v=kTlv5_Bs8aw" target="_blank"><div class="item"><img src="https://i.imgur.com/N7zQszP.jpeg"></div></a>
    <a href="https://www.youtube.com/watch?v=hlZnYV9m1cU" target="_blank"><div class="item"><img src="https://i.imgur.com/gJSj3Li.jpeg"></div></a>
    <a href="https://www.youtube.com/watch?v=9mQk7Evt6Vs" target="_blank"><div class="item"><img src="https://i.imgur.com/iCVxYgW.jpeg"></div></a>
  </div>

  <span class="back-btn" onclick="goTo('home')">⬅ 返回首頁</span>
</div>

<script>
function goTo(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}
</script>

</body>
</html>
