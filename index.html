<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>動物方城市2 主題 — K-pop 扭蛋機</title>
<style>
  /* ---------- 整體風格（動物方城市2 風格意象：圓潤、活潑、暖色點綴） ---------- */
  :root{
    --bg:#f5f3ef;
    --card:#ffffff;
    --accent:#ffb86b;   /* warm orange accent */
    --accent-dark:#e59445;
    --muted:#9b9b9b;
    --text:#222;
    --shadow: 0 10px 20px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family: "Noto Sans TC", "Segoe UI", Roboto, Arial, sans-serif;background:linear-gradient(180deg,#e9f7ff 0%,var(--bg) 60%);color:var(--text)}
  a{color:inherit}
  .wrap{max-width:1100px;margin:28px auto;padding:24px}
  header{
    display:flex;align-items:center;gap:16px;padding:14px;border-radius:14px;background:linear-gradient(90deg,#fff 0%, #fff9f3 100%);box-shadow:var(--shadow);
  }
  .logo{
    width:76px;height:76px;border-radius:12px;background:linear-gradient(135deg,#ffd7a6,#ffb86b);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,0.08)
  }
  header h1{margin:0;font-size:20px}
  header p{margin:0;color:var(--muted);font-size:13px}

  /* 選單卡片 */
  .grid{display:flex;gap:18px;margin-top:24px;flex-wrap:wrap}
  .card{
    flex:1 1 320px;background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;
    display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  }
  .card:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(0,0,0,0.12)}
  .card h2{margin:0;font-size:18px}
  .card p{margin:0;color:var(--muted);font-size:14px}
  .card .icon{width:54px;height:54px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 10px rgba(0,0,0,0.06)}

  /* 區域：抽獎機 UI */
  .stage{
    margin-top:26px;background:linear-gradient(180deg,#fff,#fffaf0);border-radius:14px;padding:18px;box-shadow:var(--shadow);
    min-height:420px;display:flex;flex-direction:column;
  }

  .controls{display:flex;align-items:center;gap:12px;margin-top:14px}
  .btn{
    padding:12px 18px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-dark));color:#fff;border:none;cursor:pointer;font-weight:600;box-shadow:0 8px 20px rgba(229,148,69,0.18);
  }
  .btn.secondary{background:#fff;border:1px solid #eee;color:var(--text);font-weight:600}
  .btn:active{transform:translateY(2px)}

  /* 扭蛋滾筒 */
  .gacha-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:22px}
  .gacha-display{
    width:520px;height:260px;border-radius:12px;background:linear-gradient(180deg,#111 0%, #222 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }
  .gacha-strip{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;height:80px;overflow:hidden;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .gacha-list{
    display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
    transform:translateY(0);
  }
  .gacha-item{
    width:420px;height:60px;background:linear-gradient(90deg,rgba(255,255,255,0.03),rgba(0,0,0,0.08));border-radius:8px;display:flex;align-items:center;gap:12px;padding:8px 12px;
    font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,0.4)
  }

  /* 顯示結果區塊 */
  .result{
    margin-top:16px;background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;width:92%;display:flex;gap:12px;align-items:center;
  }
  .result img{width:140px;height:80px;object-fit:cover;border-radius:8px;border:2px solid rgba(255,255,255,0.06)}
  .result .meta{flex:1}
  .meta h3{margin:0;font-size:18px}
  .meta p{margin:6px 0;color:#eee;font-size:14px}
  .meta a{display:inline-block;margin-top:6px;color:#fff;background:rgba(0,0,0,0.15);padding:8px 10px;border-radius:8px;text-decoration:none}

  /* 動畫：滾動效果 (使用 JS 變更 transform) */
  /* 響應式 */
  @media (max-width:760px){
    .gacha-display{width:320px;height:220px}
    .gacha-strip{width:280px}
    .result{flex-direction:column;align-items:flex-start}
    .result img{width:100%;height:180px}
  }

  /* 小提示裝飾 */
  .hint{color:var(--muted);font-size:13px;margin-top:8px}
  footer{margin-top:20px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo">Z2</div>
    <div>
      <h1>動物方城市2 風 — K-pop 扭蛋機</h1>
      <p>選一個主題，像扭蛋一樣抽出歌或偶像吧！</p>
    </div>
  </header>

  <!-- 兩大選項卡 -->
  <div class="grid" id="choices">
    <div class="card" data-target="music">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="icon">🎵</div>
        <div>
          <h2>K-pop 音樂</h2>
          <p>點進去使用扭蛋機抽一首熱門 K-pop 歌曲（含 MV 連結與縮圖）</p>
        </div>
      </div>
    </div>

    <div class="card" data-target="stars">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="icon">🌟</div>
        <div>
          <h2>K-pop 明星</h2>
          <p>抽出一位 K-pop 偶像（團體會顯示成員、出道日、維基圖片）</p>
        </div>
      </div>
    </div>

    <div class="card" data-target="about">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="icon">🎲</div>
        <div>
          <h2>關於 & 操作說明</h2>
          <p>說明抽獎行為與資料來源（YouTube、Wikipedia）</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 抽獎舞台（預設隱藏直到選擇） -->
  <div class="stage" id="stage" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;gap:12px;align-items:center">
        <strong id="stage-title" style="font-size:18px">—</strong>
        <div class="hint" id="stage-sub">按「開始抽獎」來抽出項目</div>
      </div>
      <div class="controls">
        <button class="btn" id="start-btn">開始抽獎</button>
        <button class="btn secondary" id="stop-btn">立即停止</button>
        <button class="btn secondary" id="back-btn">返回</button>
      </div>
    </div>

    <div class="gacha-wrap">
      <div class="gacha-display" aria-hidden="false">
        <!-- 中間顯示快速滾動的列表 (垂直) -->
        <div class="gacha-strip" id="gacha-strip">
          <div class="gacha-list" id="gacha-list">
            <!-- JS 會填入多個 .gacha-item 元素並做 translateY -->
          </div>
        </div>

        <!-- 中央高亮線（視覺） -->
        <div style="position:absolute;left:0;right:0;top:calc(50% - 30px);height:60px;border-top:2px solid rgba(255,255,255,0.06);border-bottom:2px solid rgba(0,0,0,0.12);pointer-events:none"></div>
      </div>
    </div>

    <!-- 顯示結果 -->
    <div id="result-area" style="display:none" class="result" aria-live="polite">
      <img id="result-img" src="" alt="result image">
      <div class="meta">
        <h3 id="result-title">結果標題</h3>
        <p id="result-sub">子標 / 額外資訊</p>
        <a id="result-link" href="#" target="_blank">觀看 MV / 維基頁面</a>
      </div>
    </div>

    <div id="extra-info" style="display:none;margin-top:10px;color:var(--muted)"></div>
  </div>

  <footer>
    資料來源：YouTube（影片連結與縮圖）與 Wikipedia（偶像圖片與摘要）。若維基無縮圖或摘要會使用預設圖示。
  </footer>
</div>

<script>
/* ------------------------
   資料：歌曲與偶像（可編輯擴充）
   songs: 每個 object: {title, artist, ytId}
   idols: 每個 object: {name, type: "group"|"solo", debut: "YYYY-MM-DD" (optional), members: [..] (optional), wikiTitle: 可用於抓維基 API}
   ------------------------ */
const songs = [
  { title:"Dynamite", artist:"BTS", ytId:"gdZLi9oWNZg" },
  { title:"Mic Drop", artist:"BTS", ytId:"kTlv5_Bs8aw" },
  { title:"Magic Shop", artist:"BTS", ytId:"9mQk7Evt6Vs" },
  { title:"Killin' It Girl", artist:"(recommendation)", ytId:"hlZnYV9m1cU" }, // 若 ytId 有誤可改
  { title:"Boy With Luv", artist:"BTS (feat. Halsey)", ytId:"MBdVXkSdhwU" },
  { title:"How You Like That", artist:"BLACKPINK", ytId:"ioNng23DkIM" },
  { title:"Super Shy", artist:"NewJeans", ytId:"GZjt_sA2eso" },
  { title:"Maniac", artist:"Stray Kids", ytId:"NfxG9IGJvYk" },
  { title:"Fake Love", artist:"BTS", ytId:"7C2z4GqqS5E" },
  { title:"Permission to Dance", artist:"BTS", ytId:"CuklIb9d3fI" }
];

const idols = [
  { name:"BTS", type:"group", debut:"2013-06-13", members:["RM","Jin","Suga","J-Hope","Jimin","V","Jungkook"], wikiTitle:"BTS" },
  { name:"J-Hope", type:"solo", debut:"2013-06-13", wikiTitle:"J-Hope" },
  { name:"BLACKPINK", type:"group", debut:"2016-08-08", members:["Jisoo","Jennie","Rosé","Lisa"], wikiTitle:"BLACKPINK" },
  { name:"IU", type:"solo", debut:"2008-09-18", wikiTitle:"IU (singer)" },
  { name:"TWICE", type:"group", debut:"2015-10-20", members:["Nayeon","Jeongyeon","Momo","Sana","Jihyo","Mina","Dahyun","Chaeyoung","Tzuyu"], wikiTitle:"Twice" },
  { name:"Stray Kids", type:"group", debut:"2017-03-25", members:["Bang Chan","Lee Know","Changbin","Hyunjin","Han","Felix","Seungmin","I.N"], wikiTitle:"Stray Kids" },
  { name:"Jungkook", type:"solo", debut:"2013-06-13", wikiTitle:"Jungkook" }
];

/* ------------------------
   DOM 元件綁定 與 初始行為
   ------------------------ */
const choices = document.getElementById('choices');
const stage = document.getElementById('stage');
const stageTitle = document.getElementById('stage-title');
const stageSub = document.getElementById('stage-sub');
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
const backBtn = document.getElementById('back-btn');
const gachaListEl = document.getElementById('gacha-list');
const gachaStrip = document.getElementById('gacha-strip');
const resultArea = document.getElementById('result-area');
const resultImg = document.getElementById('result-img');
const resultTitle = document.getElementById('result-title');
const resultSub = document.getElementById('result-sub');
const resultLink = document.getElementById('result-link');
const extraInfo = document.getElementById('extra-info');

let currentMode = null;   // "music" or "stars"
let spinInterval = null;
let spinning = false;

/* 點選選項卡 */
choices.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(!card) return;
  const t = card.dataset.target;
  if(t==='about'){
    alert("操作說明：\n\n1) 選 K-pop 音樂 或 K-pop 明星\n2) 按「開始抽獎」模擬扭蛋機\n3) 結果會顯示歌曲/藝人資訊；藝人資訊會嘗試從 Wikipedia 抓圖與摘要。");
    return;
  }
  openStage(t);
});

/* 開啟舞台 */
function openStage(mode){
  currentMode = mode;
  choices.style.display='none';
  stage.style.display='block';
  resultArea.style.display='none';
  extraInfo.style.display='none';
  // 設定標題與列表
  if(mode==='music'){
    stageTitle.textContent = "K-pop 音樂 扭蛋機";
    stageSub.textContent = "抽出一首熱門 K-pop 歌曲（含 MV 與縮圖）";
    populateGacha(songs.map(s=>`${s.title} — ${s.artist}`));
  } else if(mode==='stars'){
    stageTitle.textContent = "K-pop 明星 扭蛋機";
    stageSub.textContent = "抽出一位 K-pop 偶像（團體會顯示成員）";
    populateGacha(idols.map(i=>i.name));
  }
}

/* 回到選單 */
backBtn.addEventListener('click', ()=>{
  resetGacha();
  stage.style.display='none';
  choices.style.display='flex';
});

/* 填入滾動條內容 */
function populateGacha(labels){
  gachaListEl.innerHTML='';
  // 為了更順暢，重複內容多次
  const repeats = 12;
  for(let r=0;r<repeats;r++){
    for(let i=0;i<labels.length;i++){
      const el = document.createElement('div');
      el.className = 'gacha-item';
      el.textContent = labels[i];
      gachaListEl.appendChild(el);
    }
  }
  // reset transform
  gachaListEl.style.transform = 'translateY(0px)';
}

/* 開始抽獎 */
startBtn.addEventListener('click', ()=>{
  if(spinning) return;
  spinning = true;
  resultArea.style.display='none';
  extraInfo.style.display='none';
  stageSub.textContent = '抽獎中… 按「立即停止」可加速停止';
  // 以 interval 快速改變 translateY 的值，然後逐步減速
  let speed = 40 + Math.random()*20; // 初速
  let deceleration = 0.985 - Math.random()*0.003; // 慢慢減速
  let pos = 0;
  spinInterval = setInterval(()=>{
    pos += speed;
    gachaListEl.style.transform = `translateY(-${pos}px)`;
    // 讓 pos 循環 (避免數值過大)
    const totalHeight = gachaListEl.scrollHeight;
    if(pos > totalHeight/2) pos = pos % (totalHeight/3);
    // 自動慢慢減速並於某條件停止
    speed *= deceleration;
    if(speed < 0.5){
      // 觸發停止流程（選定結果）
      stopSpinByAuto();
    }
  }, 16);
});

/* 立即停止按鈕：快速降低速度，讓停止較快 */
stopBtn.addEventListener('click', ()=>{
  if(!spinning) return;
  // 強行將 deceleration 變小，以快速停止
  if(spinInterval){
    clearInterval(spinInterval);
    // 用短暫平滑停下
    smoothStop();
  }
});

/* 自動停止（當 speed 小於閾值時） */
function stopSpinByAuto(){
  if(spinInterval){
    clearInterval(spinInterval);
    smoothStop();
  }
}

/* 平滑停止（計算目前顯示中央的元素） */
function smoothStop(){
  // 取得 gacha-list 的位置與高度，計算中央所在的 item
  const items = Array.from(gachaListEl.querySelectorAll('.gacha-item'));
  if(items.length===0){
    spinning=false;
    return;
  }
  // 目前 transformY
  const computed = window.getComputedStyle(gachaListEl).transform;
  let ty = 0;
  if(computed && computed !== 'none'){
    const mat = computed.match(/matrix\\((.+)\\)/);
    if(mat){
      const parts = mat[1].split(',').map(p=>parseFloat(p));
      ty = Math.abs(parts[5]);
    }
  } else {
    // fallback parse from style
    const m = (gachaListEl.style.transform || '').match(/translateY\\(-?([0-9.]+)px\\)/);
    ty = m ? parseFloat(m[1]) : 0;
  }
  // height of each item (assume uniform)
  const sample = items[0].getBoundingClientRect().height + 8; // gap accounted
  // center offset within gacha-strip
  const stripRect = document.getElementById('gacha-strip').getBoundingClientRect();
  const centerPos = ty + (stripRect.height/2) - (sample/2);
  // which index:
  const idx = Math.round(centerPos / sample) % items.length;
  const chosenIndex = ((idx % items.length) + items.length) % items.length;
  const chosen = items[chosenIndex];
  // animate to align exactly to that item
  const targetTy = chosenIndex * sample;
  // animate using requestAnimationFrame
  const duration = 600;
  const start = ty;
  const change = targetTy - start;
  let startTime = null;
  function animateStop(time){
    if(!startTime) startTime = time;
    const t = Math.min(1, (time - startTime)/duration);
    const ease = 1 - Math.pow(1 - t, 3);
    const cur = start + change * ease;
    gachaListEl.style.transform = `translateY(-${cur}px)`;
    if(t < 1) requestAnimationFrame(animateStop);
    else {
      // 完成，顯示結果
      spinning=false;
      revealResult(chosen.textContent);
    }
  }
  requestAnimationFrame(animateStop);
}

/* 若扭蛋 list 的文字是 "歌 — 藝人" 或藝人名字，revealResult 會根據 currentMode 處理 */
function revealResult(text){
  // text 可能為 "title — artist"（歌曲）或藝人名稱
  resultArea.style.display='flex';
  extraInfo.style.display='none';
  if(currentMode === 'music'){
    // 以 songs 陣列尋找對應項（用 startsWith 或包含）
    const match = songs.find(s => `${s.title} — ${s.artist}` === text) || songs.find(s => text.includes(s.title)) || songs[Math.floor(Math.random()*songs.length)];
    // 生成 youtube thumbnail
    const thumb = `https://i.ytimg.com/vi/${match.ytId}/hqdefault.jpg`;
    resultImg.src = thumb;
    resultTitle.textContent = `${match.title}`;
    resultSub.textContent = `演唱：${match.artist}`;
    resultLink.href = `https://www.youtube.com/watch?v=${match.ytId}`;
    resultLink.textContent = "觀看 MV（在 YouTube 開啟）";
    extraInfo.style.display='block';
    extraInfo.textContent = "提示：點上方按鈕可再次抽獎或返回上一步";
  } else if(currentMode === 'stars'){
    // 找到 idols
    const match = idols.find(i => i.name === text) || idols[Math.floor(Math.random()*idols.length)];
    resultTitle.textContent = match.name;
    // 嘗試用 Wikipedia API 抓縮圖/摘要
    resultImg.src = '';
    resultSub.textContent = (match.debut ? `出道：${match.debut}` : '') + (match.type === 'group' && match.members ? ` • 成員：${match.members.join(', ')}` : '');
    resultLink.href = `https://en.wikipedia.org/wiki/${encodeURIComponent(match.wikiTitle)}`;
    resultLink.textContent = "查看 Wikipedia（新分頁）";
    // fetch wiki summary for image + extract
    fetchWikiSummary(match.wikiTitle).then(w=>{
      if(w && w.thumbnail && w.thumbnail.source){
        resultImg.src = w.thumbnail.source;
      } else {
        // fallback：使用一張可愛的預設圖（data URL or placeholder）
        resultImg.src = 'https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg';
      }
      // 將摘要放在 extra-info
      if(w && w.extract){
        extraInfo.style.display='block';
        extraInfo.textContent = w.extract;
      } else {
        extraInfo.style.display='block';
        extraInfo.textContent = match.type==='group' && match.members ? `成員：${match.members.join(', ')}` : '更多資訊請點選「查看 Wikipedia」';
      }
    }).catch(err=>{
      extraInfo.style.display='block';
      extraInfo.textContent = match.type==='group' && match.members ? `成員：${match.members.join(', ')}` : '更多資訊請點選「查看 Wikipedia」';
      resultImg.src = 'https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg';
    });
  }
}

/* fetch Wikipedia summary (REST v1 summary) */
async function fetchWikiSummary(title){
  try{
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    return data;
  } catch(e){
    return null;
  }
}

/* 重置（返回初始狀態） */
function resetGacha(){
  if(spinInterval) clearInterval(spinInterval);
  spinning=false;
  gachaListEl.style.transform='translateY(0px)';
  resultArea.style.display='none';
  extraInfo.style.display='none';
}

/* 小改進：若使用者未按停止但關閉頁面或切換，保險清理 */
window.addEventListener('beforeunload', ()=>{
  if(spinInterval) clearInterval(spinInterval);
});

/* 預防在 mobile 上快速點擊造成混亂 */
startBtn.addEventListener('click', ()=>{
  startBtn.disabled = true;
  setTimeout(()=>startBtn.disabled = false, 800);
});
stopBtn.addEventListener('click', ()=>{
  stopBtn.disabled = true;
  setTimeout(()=>stopBtn.disabled = false, 600);
});
backBtn.addEventListener('click', ()=>{
  resetGacha();
});

</script>
</body>
</html>
