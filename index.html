<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>復古電視機 - 多平台頻道</title>

<style>
body {
  background: #f5e9d3;
  font-family: "Arial", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  padding: 0;
  margin: 0;
}

/* 📺 電視外框 */
.tv-frame {
  width: 850px;
  height: 600px;
  background: #2a2a2a;
  border-radius: 25px;
  padding: 25px;
  position: relative;
  box-shadow: 0 0 35px rgba(0,0,0,0.45);
}

/* 📺 螢幕 */
.screen {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  border-radius: 15px;
  position: relative;
}

#staticEffect {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('https://i.imgur.com/6Qon3rL.gif');
  background-size: cover;
  opacity: 0;
  transition: 0.3s;
  pointer-events: none;
}

/* 頻道頁 */
.page {
  display: none;
  color: white;
  padding: 30px;
  text-align: center;
  font-size: 28px;
}

.page.active {
  display: block;
}

/* 🎛 右側 APP 按鈕 (PC) */
.tv-buttons {
  position: absolute;
  right: -120px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.app-btn {
  width: 90px;
  height: 90px;
  border-radius: 20px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: #000;
  border: 3px solid #888;
  cursor: pointer;
  transition: 0.1s;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.app-btn:active {
  transform: scale(0.9);
}

.knob-label {
  color: #333;
  text-align: center;
  font-size: 15px;
  margin-top: 5px;
}

/* 📱 手機模式：下滑選單 */
.mobile-menu {
  display: none;
  width: 100%;
  padding: 15px 0;
  background: #ffffffcc;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  position: absolute;
  bottom: -150px;
  border-radius: 0 0 20px 20px;
}

.mobile-menu button {
  width: 100%;
  padding: 18px;
  font-size: 20px;
  border: none;
  background: #333;
  color: white;
  border-bottom: 1px solid #555;
}

.mobile-menu button:active {
  background: #555;
}

/* 📱 當寬度 < 950px（手機） */
@media (max-width: 950px) {

  body {
    flex-direction: column;
    height: auto;
    padding-top: 40px;
  }

  .tv-frame {
    width: 95vw;
    height: 70vh;
  }

  .tv-buttons {
    display: none; /* PC按鈕隱藏 */
  }

  .mobile-menu {
    display: block;
  }
}
</style>
</head>
<body>

<!-- 📱 手機版下滑選單 -->
<div class="mobile-menu">
  <button onclick="switchChannel('home')">🏠 主頁</button>
  <button onclick="switchChannel('youtube')">▶ YouTube</button>
  <button onclick="switchChannel('netflix')">🎬 Netflix</button>
  <button onclick="switchChannel('disney')">🐭 Disney+</button>
  <button onclick="switchChannel('iqiyi')">🟢 愛奇藝</button>
</div>

<div class="tv-frame">
  <div class="screen">

    <div id="staticEffect"></div>

    <div id="home" class="page active">
      📺 很久沒有打開電視機了吧？<br><br>
      👉 請用右邊或下方選擇你想看的頻道
    </div>

    <div id="youtube" class="page">
      <h2>YouTube 熱門影片</h2>
      <a href="https://www.youtube.com/" target="_blank" style="color:#4ac4ff;">
        ▶ 前往 YouTube
      </a>
    </div>

    <div id="netflix" class="page">
      <h2>Netflix 熱門影集</h2>
      <a href="https://www.netflix.com" target="_blank" style="color:#e50914;">
        ▶ 前往 Netflix
      </a>
    </div>

    <div id="disney" class="page">
      <h2>Disney+ 熱門動畫</h2>
      <a href="https://www.disneyplus.com" target="_blank" style="color:#7bb5ff;">
        ▶ 前往 Disney+
      </a>
    </div>

    <div id="iqiyi" class="page">
      <h2>愛奇藝 熱門節目</h2>
      <a href="https://www.iq.com" target="_blank" style="color:#91ff4a;">
        ▶ 前往 愛奇藝
      </a>
    </div>

  </div>

  <!-- 🎛 PC 右側 APP 按鈕 -->
  <div class="tv-buttons">

    <div>
      <div class="app-btn" onclick="switchChannel('home')"
        style="background-image:url('https://i.imgur.com/L0iWg7N.png');">
      </div>
      <div class="knob-label">主頁</div>
    </div>

    <div>
      <div class="app-btn" onclick="switchChannel('youtube')"
        style="background-image:url('https://i.imgur.com/9ACe6E0.png');">
      </div>
      <div class="knob-label">YouTube</div>
    </div>

    <div>
      <div class="app-btn" onclick="switchChannel('netflix')"
        style="background-image:url('https://i.imgur.com/7cEVSnp.png');">
      </div>
      <div class="knob-label">Netflix</div>
    </div>

    <div>
      <div class="app-btn" onclick="switchChannel('disney')"
        style="background-image:url('https://i.imgur.com/IqgQxYh.png');">
      </div>
      <div class="knob-label">Disney+</div>
    </div>

    <div>
      <div class="app-btn" onclick="switchChannel('iqiyi')"
        style="background-image:url('https://i.imgur.com/EJzG9gy.png');">
      </div>
      <div class="knob-label">愛奇藝</div>
    </div>

  </div>

</div>

<script>
function switchChannel(pageID) {
  const pages = document.querySelectorAll(".page");
  const staticFX = document.getElementById("staticEffect");

  pages.forEach(p => p.classList.remove("active"));
  staticFX.style.opacity = 1;

  setTimeout(() => {
    document.getElementById(pageID).classList.add("active");
    staticFX.style.opacity = 0;
  }, 600);
}
</script>

</body>
</html>
